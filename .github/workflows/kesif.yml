name: Keşif (geçici)
on:
  push:
    branches: [kesif]
    paths: ["kesif/**", ".github/workflows/kesif.yml", "tbb_cek.py", "tbb_yardimci.js"]
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          set -o pipefail
          python -u tbb_cek.py --cikti kesif/tbb_veri.csv 2>&1 | tee kesif/log.txt
          gzip -9 -f kesif/tbb_veri.csv
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kesif/log.txt
          [ -f kesif/tbb_veri.csv.gz ] && git add kesif/tbb_veri.csv.gz
          git commit -m "kesif: veri çıktısı [skip ci]" || true
          git pull --rebase -q || true
          git push
