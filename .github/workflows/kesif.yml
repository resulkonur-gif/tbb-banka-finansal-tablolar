name: Keşif (geçici)
on:
  push:
    branches: [kesif]
    paths: ["kesif/**", ".github/workflows/kesif.yml", "tbb_cek.py", "tbb_yardimci.js"]
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python tbb_cek.py --cikti kesif/tbb_veri.csv && gzip -9 -f kesif/tbb_veri.csv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kesif/tbb_veri.csv.gz
          git commit -m "kesif: ağaç çıktısı [skip ci]" || true
          git push
