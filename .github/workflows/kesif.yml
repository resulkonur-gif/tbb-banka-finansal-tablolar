name: Keşif (geçici)
on:
  push:
    branches: [kesif]
    paths: ["kesif/**", ".github/workflows/kesif.yml", "tbb_cek.py", "tbb_yardimci.js"]
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum (yeniden denemeli)
        run: |
          set -o pipefail
          ( python -m pip install --timeout 60 playwright
            for i in 1 2 3; do
              echo "== playwright kurulum denemesi $i $(date -u +%T)"
              timeout 300 python -m playwright install chromium && exit 0   # sistem kütüphaneleri GitHub sunucusunda hazır; apt deposu (azure.archive.ubuntu.com) erişilemiyor
              echo "!! deneme $i başarısız $(date -u +%T)"; sleep 20
            done; exit 1 ) 2>&1 | tee kesif/kurulum.txt
      - run: |
          set -o pipefail
          python -u tbb_cek.py --cikti kesif/tbb_veri.csv 2>&1 | tee kesif/log.txt
          gzip -9 -f kesif/tbb_veri.csv
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kesif/log.txt kesif/kurulum.txt 2>/dev/null; git add kesif/log.txt || true
          [ -f kesif/tbb_veri.csv.gz ] && git add kesif/tbb_veri.csv.gz
          git commit -m "kesif: veri çıktısı [skip ci]" || true
          git pull --rebase -q || true
          git push
