name: TBB verisini güncelle

# Her ayın 15'inde ve 28'inde (TBB'nin çeyrek verisini yayımladığı dönemleri yakalamak için)
# veriyi TBB Veri Sistemi'nden çeker, raporu üretir; veri değiştiyse docs/index.html'i günceller.
# Elle çalıştırmak için: Actions sekmesi → "TBB verisini güncelle" → Run workflow.
on:
  schedule:
    - cron: "23 5 15,28 * *"   # UTC 05:23 = Türkiye 08:23
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/guncelle.yml"]

permissions:
  contents: write

concurrency:
  group: tbb-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: TBB'den veriyi çek
        run: python tbb_cek.py --cikti tbb_veri.csv

      - name: Raporu üret
        run: python rapor_olustur.py --girdi tbb_veri.csv --html yeni_rapor.html

      - name: Veri değiştiyse raporu yayınla
        run: |
          # Veri özeti: başlık satırı (tarih içerir) hariç tüm satırların SHA-256'sı
          yeni=$(tail -n +2 tbb_veri.csv | sha256sum | cut -d' ' -f1)
          eski=$(cat docs/veri_ozeti.txt 2>/dev/null || echo yok)
          echo "eski: $eski"; echo "yeni: $yeni"
          if [ "$yeni" = "$eski" ]; then
            echo "Veri değişmemiş, rapor güncellenmedi." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mv yeni_rapor.html docs/index.html
          echo "$yeni" > docs/veri_ozeti.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/veri_ozeti.txt
          git commit -m "Rapor güncellendi: $(head -1 tbb_veri.csv | sed 's/^\xEF\xBB\xBF//; s/^# //')"
          git push
          echo "Rapor güncellendi ve yayınlandı." >> "$GITHUB_STEP_SUMMARY"

      - name: Veri dosyasını sakla (90 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbb_veri
          path: tbb_veri.csv
          if-no-files-found: ignore
